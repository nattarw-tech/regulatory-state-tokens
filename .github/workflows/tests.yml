name: tests

# Runs on every push and pull request, so each commit carries a visible
# pass/fail record. Only the rule-encoding tests run here: they are pure
# functions with no network dependency, so they are deterministic in CI.
# The scenario runs are deliberately excluded, because they submit real
# transactions to a public testnet and depend on a faucet that CI should
# not be hammering on every commit.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Rule encoding
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
